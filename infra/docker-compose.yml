services:
  postgres:
    image: postgres:17-alpine
    container_name: cj-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: conta_juntos
    ports:
      - '5433:5432'
    volumes:
      - cj_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d conta_juntos']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cj_pgdata:
